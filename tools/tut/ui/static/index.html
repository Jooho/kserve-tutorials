<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KServe Tutorials</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="toggle-sidebar" title="Show / hide the tutorial list" aria-label="Toggle tutorial list">☰</button>
    <div class="brand">KServe Tutorials <span class="muted">local runner</span></div>
    <div class="seg" id="fontsize" title="Text size (document and terminal)">
      <button data-d="-1" aria-label="Smaller text">A−</button><span id="fs-val"></span><button data-d="1" aria-label="Larger text">A+</button>
    </div>
    <div class="seg" id="termpos" title="Terminal position">
      <button data-pos="bottom" aria-label="Terminal at the bottom">⬓ Bottom</button><button data-pos="right" aria-label="Terminal on the right">◨ Right</button>
    </div>
    <label class="field">KServe
      <select id="version"></select>
    </label>
    <div class="seg" id="lang">
      <button data-lang="en" class="on">EN</button><button data-lang="ko">KO</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="seg views" id="views" role="tablist">
        <button data-view="collections" role="tab">Collections</button><button data-view="all" role="tab">All</button><button data-view="versions" role="tab">Versions</button>
      </div>
      <input id="search" type="search" placeholder="Search title, summary, tags…" aria-label="Search tutorials">
      <div class="filters">
        <select id="addtag" aria-label="Filter by tag"><option value="">＋ tag</option></select>
        <button id="showtags" class="icon-btn" aria-pressed="false" title="Show the tags of each tutorial">#&nbsp;tags</button>
        <select id="sort" aria-label="Sort"><option value="title">Sort: title</option><option value="status">Sort: status</option><option value="kserve">Sort: newest KServe</option></select>
      </div>
      <div id="tagchips"></div>
      <ul id="list"></ul>
    </aside>

    <main class="main">
      <section class="docpane" id="docpane">
        <div class="empty" id="empty">Pick a tutorial on the left.</div>
        <section id="matrix" hidden></section>
        <div id="doc-wrap" hidden>
          <div class="toolbar">
            <div class="tb-title">
              <h1 id="doc-title"></h1>
              <div class="chips" id="chips"></div>
            </div>
            <div class="tb-actions">
              <span class="progress" id="progress"></span>
              <button class="btn primary" id="next" title="Run the selected step, then select the next one (Shift+Enter). Click a step to select it.">▶ Next <kbd>⇧↵</kbd></button>
              <button class="btn" id="continue" title="Run from the first step that has not passed yet to the end">⏵ Continue</button>
              <button class="btn" id="run-all" title="Run every step again from the top, stop at the first failure">⏩ Run all</button>
              <button class="btn" id="stop" title="Ctrl-C">■ Stop</button>
              <button class="btn" id="cleanup" title="Run the cleanup blocks">🧹 Cleanup</button>
              <button class="btn" id="restart" title="Start a fresh shell (resets variables)">↻ New shell</button>
            </div>
          </div>
          <div class="problems" id="problems" hidden></div>
          <div class="envbar" id="envbar"></div>
          <article class="doc" id="doc"></article>
        </div>
      </section>

      <div class="splitter" id="splitter" title="Drag to resize"></div>

      <section class="termpane">
        <div class="termbar">
          <span id="term-title">Terminal</span>
          <span class="muted" id="term-note">You can type here too (Tab completion; aliases <code>k</code>=kubectl, <code>kc &lt;ns&gt;</code>=switch namespace). Typed commands are not tracked as steps.</span>
        </div>
        <div id="term"></div>
      </section>
    </main>
  </div>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
