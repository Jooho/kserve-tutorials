# Promote a commit of `main` to `stable` and tag a release (docs/release.md).
#
#   plan     resolve the commit, check it is on main and that stable can
#            fast-forward to it, run rules and tests, pick the version
#   verify   every runnable tutorial and revision x every tested version in the
#            CI window (N, N-1), at that commit
#   publish  only if everything passed: move stable, tag, GitHub Release, site
#
# dry_run (default for a manual run) does everything except moving stable,
# tagging and deploying. The monthly schedule (off for now, see `on:`) publishes for real, skips when
# main has no commit since the last release, and opens an issue when it fails
# (docs/rfc/0002-tutorial-revisions.md section 8).
name: release
on:
  # The monthly schedule is OFF until a first `make release` dry run passed
  # (maintainer, 2026-11-26; backlog C8). To turn it on, uncomment this line:
  # schedule: [{cron: "23 5 1 * *"}]     # the 1st of every month, 05:23 UTC
  workflow_dispatch:
    inputs:
      ref: {description: "Commit or branch on main to promote", default: main}
      dry_run: {description: "Verify and write notes only", type: boolean, default: true}

permissions: {contents: read}
concurrency: {group: release, cancel-in-progress: false}
env:
  NO_MKDOCS_2_WARNING: "1"
  # a scheduled run has no inputs: main, and a real release
  REF: ${{ inputs.ref || 'main' }}
  DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      version: ${{ steps.p.outputs.version }}
      matrix: ${{ steps.p.outputs.matrix }}
      latest: ${{ steps.p.outputs.latest }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.REF }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: tools/requirements.txt}
      - run: make setup
      - id: p
        name: Resolve commit, version and matrix
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          export TUT_LATEST_VERSION=$(gh api "repos/$(./tut project --get upstream)/releases/latest" --jq .tag_name)   # N (RFC 0002)
          echo "latest=$TUT_LATEST_VERSION" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse HEAD)
          git fetch --tags origin
          git fetch origin main
          git fetch origin stable 2>/dev/null || echo "no stable branch yet"
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$sha is not on main; only commits of main can be released"; exit 1; }
          last=$(git describe --tags --abbrev=0 --match '[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*' "$sha" 2>/dev/null || true)
          if [ -n "$last" ] && [ "$(git rev-list --count "$last..$sha")" = 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: main has no commit since $last." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          ./tut release can-ff "$sha"
          version=$(./tut release next-version)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$(./tut matrix --scheduled --json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo "- version: \`$version\`  · commit: \`${sha:0:7}\`  · dry run: \`$DRY_RUN\`"
            echo "- matrix:"; ./tut matrix --scheduled | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rules, tests and site at this commit
        if: steps.p.outputs.skip != 'true'
        run: make check

  verify:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.matrix != '[]'
    uses: ./.github/workflows/run-tutorials.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      label: release
      ref: ${{ needs.plan.outputs.sha }}

  publish:
    needs: [plan, verify]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    outputs:
      published: ${{ steps.pub.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.plan.outputs.sha }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: tools/requirements.txt}
      - run: make setup
      - uses: actions/download-artifact@v4
        with: {pattern: "report-release-*", path: reports}
      - name: Every matrix entry passed
        run: |
          mkdir -p reports
          echo '${{ needs.plan.outputs.matrix }}' > expected.json
          ./tut release check --reports reports --expected expected.json
      - name: Release notes
        env: {TUT_LATEST_VERSION: "${{ needs.plan.outputs.latest }}"}
        run: |
          ./tut release notes "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.sha }}" \
            --reports reports --repo "${{ github.repository }}" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - id: pub
        name: Move stable, tag and publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          sha="${{ needs.plan.outputs.sha }}"; version="${{ needs.plan.outputs.version }}"
          git fetch --tags origin
          git fetch origin stable 2>/dev/null || true
          ./tut release can-ff "$sha"          # stable may have moved while we verified
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push $sha to stable and create release $version" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "$sha:refs/heads/stable"
          gh release create "$version" --target "$sha" --title "$(./tut project --get title) $version" --notes-file notes.md
          echo "published=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: release-notes, path: notes.md}

  failed:
    needs: [plan, verify, publish]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions: {issues: write}
    steps:
      - name: Open an issue (nothing was published)
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        run: |
          gh issue create --title "Monthly release ${{ needs.plan.outputs.version }} failed" --body \
            "The scheduled release did not publish: \`stable\` did not move and no tag was made. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Follow docs/ci-playbook.md, fix on main; the next month (or \`make release\`) tries again."

  site:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions: {contents: read, pages: write, id-token: write}
    uses: ./.github/workflows/site.yml
    with: {ref: stable}
