# Weekly: every tutorial x every tested version, plus a canary run of
# stable tutorials against the latest upstream release (project.yaml upstream). Failures become issues.
name: scheduled
on:
  schedule: [{cron: "17 4 * * 1"}]   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      canary_version: {description: "Version for the canary (default: latest release of project.yaml upstream)", required: false}

permissions: {contents: read}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.p.outputs.full }}
      canary: ${{ steps.p.outputs.canary }}
      canary_version: ${{ steps.p.outputs.canary_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make setup
      - id: p
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          export TUT_LATEST_VERSION=$(gh api "repos/$(./tut project --get upstream)/releases/latest" --jq .tag_name)   # N (RFC 0002)
          v="${{ inputs.canary_version }}"
          [ -n "$v" ] || v=$(gh api "repos/$(./tut project --get upstream)/releases/latest" --jq .tag_name)
          echo "canary_version=$v" >> "$GITHUB_OUTPUT"
          echo "full=$(./tut matrix --scheduled --json)" >> "$GITHUB_OUTPUT"
          echo "canary=$(./tut matrix --canary "$v" --json)" >> "$GITHUB_OUTPUT"
          echo "Canary version: $v" >> "$GITHUB_STEP_SUMMARY"

  full:
    needs: plan
    if: needs.plan.outputs.full != '[]'
    uses: ./.github/workflows/run-tutorials.yml
    with: {matrix: "${{ needs.plan.outputs.full }}", label: scheduled}

  canary:
    needs: plan
    if: needs.plan.outputs.canary != '[]'
    uses: ./.github/workflows/run-tutorials.yml
    with: {matrix: "${{ needs.plan.outputs.canary }}", label: canary}

  report:
    needs: [plan, full, canary]
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "report-*", path: reports}
      - name: Summarize and file issues
        env: {GH_TOKEN: "${{ github.token }}", RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: python3 .github/scripts/report.py reports

  # Tutorials that skipped versions (a gap in versions.tested, like v0.18.0 and
  # v0.20.0). One open issue, kept up to date; closed when the list is empty.
  # The maintainer decides; with their word a local agent runs
  # `./tut revision keep <id>` (RFC 0002 section 8).
  skipped-versions:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make setup
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          title="Tutorials that skipped versions"
          gh label create ci-window --color c5def5 --force >/dev/null
          num=$(gh issue list --state open --label ci-window --json number,title --jq ".[] | select(.title == \"$title\") | .number")
          todo=$(./tut revision todo)
          if [ -z "$todo" ]; then
            [ -z "$num" ] || gh issue close "$num" --comment "No tutorial has a gap in versions.tested any more."
            exit 0
          fi
          body="$(printf 'These tutorials have a gap in versions.tested. CI runs N (the newest %s release) and the newest tested version below it, so the versions before the gap are still run, as N-1, until they are moved:\n\n```\n%s\n```\n\nWith the maintainer'"'"'s permission, a local agent runs `./tut revision keep <id>`: the versions before the gap go to a frozen revision and leave the current tutorial. docs/rfc/0002-tutorial-revisions.md section 8.\n\nRun: %s' "$(./tut project --get name)" "$todo" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --label ci-window --title "$title" --body "$body"; fi

  # A new release (docs/rfc/0002-tutorial-revisions.md section 8). No AI runs here
  # (AGENTS.md rule 13): this job opens a PR and an issue for a local agent.
  #   canary passed -> PR "add <version> to versions.tested" for those tutorials;
  #                    a local agent adds the version-scout report, the maintainer merges
  #   first time    -> issue "New release <version>": a local agent runs feature-scout
  new-version:
    needs: [plan, canary]
    if: always() && needs.plan.outputs.canary != '[]'
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    env:
      VERSION: ${{ needs.plan.outputs.canary_version }}
      BOT_TOKEN: ${{ secrets.TUT_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make setup
      - uses: actions/download-artifact@v4
        with: {pattern: "report-canary-*", path: reports}
      - name: Issue for feature-scout (once per release)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          title="New release $VERSION: look for tutorial proposals"
          gh label create new-release --color 0e8a16 --force >/dev/null
          found=$(gh issue list --state all --label new-release --search "in:title \"$title\"" --json title --jq ".[] | select(.title == \"$title\") | .title")
          if [ -z "$found" ]; then
            gh issue create --label new-release --title "$title" --body "$(cat <<BODY
          $(./tut project --get name) $VERSION was released. A local agent runs the \`feature-scout\` agent (.claude/agents/feature-scout.md) against it and, with the maintainer's permission, files one \`tutorial-proposal\` issue per candidate feature (docs/rfc/0002-tutorial-revisions.md section 8).

          Canary run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY
          )"
          fi
      - name: Bot PR adding the version to the tutorials that passed
        run: |
          passed=$(python3 -c "import json,glob; print(' '.join(sorted({json.load(open(f))['tutorial'] for f in glob.glob('reports/report-canary-*/report.json') if json.load(open(f))['status'] == 'passed'})))")
          if [ -z "$passed" ]; then echo "No tutorial passed the canary on $VERSION."; exit 0; fi
          if [ -z "$BOT_TOKEN" ]; then
            echo "::notice::Canary passed on $VERSION for: $passed. Set the repository secret TUT_BOT_TOKEN (a PAT or GitHub App token that may push and open PRs) to get the PR automatically."
            exit 0
          fi
          branch="bot/tested-$VERSION"
          export GH_TOKEN="$BOT_TOKEN"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch is already open."; exit 0
          fi
          git config user.name "kserve-tutorials-bot"
          git config user.email "kserve-tutorials-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git"
          git switch -c "$branch"
          # shellcheck disable=SC2086
          ./tut tested add "$VERSION" $passed
          ./tut sync >/dev/null
          git add -A tutorials README.md README.ko.md .github/CODEOWNERS 2>/dev/null || git add -A tutorials
          git commit -s -m "Add $VERSION to versions.tested: $passed (canary passed)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Add $VERSION to versions.tested ($passed)" --body "$(cat <<BODY
          The weekly canary ran these tutorials on $VERSION and they passed: $passed.

          Before merging: a local agent runs the version-scout agent for $VERSION and adds its report here (a passing run does not prove the explanations are still right). The maintainer merges.

          Canary run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY
          )"
