# Reusable: execute a matrix of {tutorial, kserve_version} and upload one JSON report each.
name: run-tutorials
on:
  workflow_call:
    inputs:
      matrix: {type: string, required: true, description: "JSON list from ./tut affected|matrix --json"}
      label: {type: string, default: pr, description: "pr | scheduled | canary (used in artifact names)"}

permissions: {contents: read}

jobs:
  run:
    name: ${{ matrix.tutorial }} @ ${{ matrix.kserve_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: tools/requirements.txt}
      - uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - run: pip install -r tools/requirements.txt
      - name: Free disk space (model-serving images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Run tutorial
        run: |
          ./tut run "${{ matrix.tutorial }}" \
            --kserve-version "${{ matrix.kserve_version }}" \
            --teardown-env --report report.json
      - name: Summary
        if: always()
        run: |
          if [ -f report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json; r = json.load(open("report.json"))
          icon = "✅" if r["status"] == "passed" else "❌"
          print(f"{icon} **{r['tutorial']}** on KServe {r['kserve_version']} — {r['status']} in {r['duration_seconds']}s")
          if r["failed_at"]: print(f"\nFailed at `{r['failed_at']}`")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ inputs.label }}-${{ matrix.tutorial }}-${{ matrix.kserve_version }}
          path: report.json
          if-no-files-found: ignore
