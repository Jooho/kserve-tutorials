# Reusable: execute a matrix of {tutorial, version} and upload one JSON report each.
name: run-tutorials
on:
  workflow_call:
    inputs:
      matrix: {type: string, required: true, description: "JSON list from ./tut affected|matrix --json"}
      label: {type: string, default: pr, description: "pr | scheduled | canary | release (used in artifact names)"}
      ref: {type: string, default: "", description: "commit to check out (default: the triggering ref)"}

permissions: {contents: read}

jobs:
  run:
    name: ${{ matrix.tutorial }}${{ matrix.revision && format(' ({0})', matrix.revision) || '' }} @ ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: tools/requirements.txt}
      - name: Toolkit (same as users)
        run: make setup
      - name: Cache environment tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('envs/*/*/tools.env') }}
      - name: Machine check
        run: make doctor T=${{ matrix.tutorial }}
      - name: Free disk space (model-serving images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Run tutorial
        run: |
          ./tut run "${{ matrix.tutorial }}" \
            --version "${{ matrix.version }}" \
            --twice --keep-on-failure --report report.json
      - name: Diagnostics (on failure)
        if: failure()
        run: .github/scripts/diagnose.sh
      - name: Tear down environment
        if: always() && matrix.env
        run: envs/${{ matrix.env }}/teardown.sh
      - name: Summary
        if: always()
        run: |
          if [ -f report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, subprocess; r = json.load(open("report.json"))
          name = subprocess.run(["./tut", "project", "--get", "name"], capture_output=True, text=True).stdout.strip()
          icon = "✅" if r["status"] == "passed" else "❌"
          print(f"{icon} **{r['tutorial']}** on {name} {r['version']} — {r['status']} in {r['duration_seconds']}s")
          if r["failed_at"]: print(f"\nFailed at `{r['failed_at']}`")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ inputs.label }}-${{ matrix.tutorial }}-${{ matrix.version }}
          path: report.json
          if-no-files-found: ignore
