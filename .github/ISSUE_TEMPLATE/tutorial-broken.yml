name: A tutorial step does not work
description: Tell us which tutorial and which step failed.
labels: [tutorial-broken]
body:
  - type: input
    id: tutorial
    attributes: {label: Tutorial id, description: "e.g. llmisvc-anatomy (the directory name)"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: KServe version, description: "echo $KSERVE_VERSION"}
    validations: {required: true}
  - type: textarea
    id: step
    attributes: {label: Which step failed and what happened?, render: text}
    validations: {required: true}
  - type: textarea
    id: env
    attributes: {label: Environment, description: "OS, Docker / Kind / kubectl versions, CPU & memory"}
