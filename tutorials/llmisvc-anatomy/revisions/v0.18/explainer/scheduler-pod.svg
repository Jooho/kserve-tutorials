<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t d">
<title id="t">Inside the EPP scheduler Pod</title>
<desc id="d">Two containers: main, the endpoint picker with gRPC, health and metrics ports, and the tokenizer sidecar, which the default plugin set does not use. The init container storage-initializer exists only for the sidecar: it downloads the tokenizer files into /mnt/models.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
  .h { font-size: 15px; font-weight: 650; }
  .s { font-size: 12.5px; fill: #4a5263; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #2b3140; }
  .pod { fill: none; stroke: #868e96; stroke-width: 1.5; }
  .init { fill: #f8f9fa; stroke: #868e96; stroke-width: 1.3; stroke-dasharray: 5 4; }
  .main { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.5; }
  .idle { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.3; }
  .ext { fill: #eef2ff; stroke: #3b5bdb; stroke-width: 1.5; }
  .arrow { stroke: #6b7385; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .ah { fill: #6b7385; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e9ef; } .s { fill: #b4bccb; } .m { fill: #d5dae3; }
    .init, .idle { fill: #1b2029; } .main { fill: #132a3d; stroke: #4dabf7; } .ext { fill: #1e2540; stroke: #748ffc; }
    .arrow { stroke: #8b93a5; } .ah { fill: #8b93a5; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

<rect class="pod" x="16" y="16" width="848" height="290" rx="14"/>
<text class="h" x="32" y="42">Pod demo-model-kserve-router-scheduler-...  (2/2 Running)</text>

<rect class="main" x="32" y="60" width="470" height="230" rx="10"/>
<text class="h" x="46" y="86">main: the endpoint picker (EPP)</text>
<text class="m" x="46" y="106">ghcr.io/llm-d/llm-d-router-endpoint-picker</text>
<text class="m" x="46" y="134">:9002 grpc         ExtProc, called by Envoy</text>
<text class="m" x="46" y="150">:9003 grpc-health</text>
<text class="m" x="46" y="166">:9090 metrics</text>
<text class="s" x="46" y="198">plugins (--config-text): single-profile-handler,</text>
<text class="s" x="46" y="216">profile default: queue-scorer weight 2,</text>
<text class="s" x="46" y="234">prefix-cache-scorer weight 3, max-score-picker</text>

<rect class="init" x="522" y="60" width="326" height="74" rx="9"/>
<text class="h" x="536" y="82">init: storage-initializer</text>
<text class="s" x="536" y="102">Added for the tokenizer sidecar: downloads</text>
<text class="s" x="536" y="120">only tokenizer files, no model weights.</text>
<path class="arrow" d="M685 134 L685 154"/>
<text class="m" x="694" y="149">/mnt/models</text>

<rect class="idle" x="522" y="158" width="326" height="132" rx="10"/>
<text class="h" x="536" y="182">tokenizer (sidecar)</text>
<text class="m" x="536" y="200">ghcr.io/llm-d/llm-d-uds-tokenizer</text>
<text class="s" x="536" y="226">Not used by the plugins on the left.</text>
<text class="s" x="536" y="244">precise-prefix-cache-scorer would</text>
<text class="s" x="536" y="262">use it (over a Unix socket in the</text>
<text class="s" x="536" y="280">same Pod); it is not configured.</text>

<rect class="ext" x="32" y="322" width="250" height="44" rx="9"/>
<text class="h" x="46" y="349">Envoy Gateway</text>
<path class="arrow" d="M200 322 C 210 305, 220 300, 236 292"/>
</svg>
