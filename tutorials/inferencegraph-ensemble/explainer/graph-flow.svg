<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
<title id="t">One request through the Sequence + Ensemble graph</title>
<desc id="d">curl sends the request to localhost:8080, a port-forward to ingress-nginx, with the Host header of the graph. The Ingress sends it to the router Service. The router runs the Sequence: step 1 is the Ensemble node, which calls the XGBoost and LightGBM predictors in parallel and collects their answers as "0" and "1"; step 2 sends that collected response to the combiner, which returns the average.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
  .h { font-size: 15px; font-weight: 650; }
  .s { font-size: 12.5px; fill: #4a5263; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #2b3140; }
  .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .cl { fill: #f8f9fa; stroke: #868e96; stroke-width: 1.5; }
  .gw { fill: #eef2ff; stroke: #3b5bdb; stroke-width: 1.5; }
  .rt { fill: #f3f0ff; stroke: #7048e8; stroke-width: 1.5; }
  .md { fill: #ebfbee; stroke: #2f9e44; stroke-width: 1.5; }
  .cb { fill: #fff4e6; stroke: #e8590c; stroke-width: 1.5; }
  .frame { fill: none; stroke: #7048e8; stroke-width: 1.3; stroke-dasharray: 6 4; }
  .arrow { stroke: #6b7385; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .ah { fill: #6b7385; }
  .badge { fill: #e03131; }
  .dot { fill: #e03131; }
  .d1 { animation: one 8s infinite; }
  .d2 { animation: two 8s infinite; }
  .d3 { animation: three 8s infinite; }
  @keyframes one {
    0%   { transform: translate(84px, 110px); opacity: 0 }
    4%   { opacity: 1 }
    14%  { transform: translate(260px, 110px) }
    26%  { transform: translate(450px, 110px) }
    34%  { transform: translate(450px, 110px); opacity: 1 }
    35%, 100% { transform: translate(450px, 110px); opacity: 0 }
  }
  @keyframes two {
    0%, 34% { transform: translate(450px, 110px); opacity: 0 }
    35% { opacity: 1 }
    50% { transform: translate(826px, 72px) }
    58% { transform: translate(826px, 72px) }
    70% { transform: translate(450px, 250px); opacity: 1 }
    71%, 100% { transform: translate(450px, 250px); opacity: 0 }
  }
  @keyframes three {
    0%, 34% { transform: translate(450px, 110px); opacity: 0 }
    35% { opacity: 1 }
    50% { transform: translate(826px, 160px) }
    58% { transform: translate(826px, 160px) }
    70% { transform: translate(450px, 250px) }
    86% { transform: translate(826px, 332px) }
    96% { transform: translate(826px, 332px); opacity: 1 }
    100% { transform: translate(826px, 332px); opacity: 0 }
  }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e9ef; } .s { fill: #b4bccb; } .m { fill: #d5dae3; } .n { fill: #ffffff; }
    .cl { fill: #1b2029; } .gw { fill: #1e2540; stroke: #748ffc; } .rt { fill: #241f3d; stroke: #9775fa; }
    .md { fill: #16301d; stroke: #51cf66; } .cb { fill: #3a2414; stroke: #ff922b; } .frame { stroke: #9775fa; }
    .arrow { stroke: #8b93a5; } .ah { fill: #8b93a5; }
  }
  @media (prefers-reduced-motion: reduce) { .d1, .d2, .d3 { animation: none; } .d1, .d2 { opacity: 0; } }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

<!-- client and ingress -->
<rect class="cl" x="16" y="62" width="150" height="96" rx="10"/>
<text class="h" x="28" y="86">curl</text>
<text class="m" x="28" y="106">localhost:8080</text>
<text class="m" x="28" y="122">Host: housing-</text>
<text class="m" x="28" y="138">price-graph.127...</text>

<rect class="gw" x="190" y="62" width="150" height="96" rx="10"/>
<text class="h" x="202" y="86">ingress-nginx</text>
<text class="s" x="202" y="106">port-forward 8080:80</text>
<text class="s" x="202" y="122">Ingress by Host</text>
<text class="s" x="202" y="138">-&gt; Service :80</text>

<!-- router frame -->
<rect class="frame" x="364" y="20" width="500" height="420" rx="14"/>
<text class="s" x="378" y="40">router Pod housing-price-graph (kserve/router, --graph-json)</text>

<rect class="rt" x="380" y="62" width="140" height="96" rx="10"/>
<text class="h" x="392" y="86">root: Sequence</text>
<text class="s" x="392" y="106">step 1:</text>
<text class="m" x="392" y="122">ensemble-node</text>
<text class="s" x="392" y="142">then step 2</text>

<rect class="md" x="560" y="46" width="290" height="52" rx="10"/>
<text class="h" x="572" y="68">xgboost-predictor</text>
<text class="m" x="572" y="88">/v2/models/.../infer -&gt; 2.7366</text>

<rect class="md" x="560" y="134" width="290" height="52" rx="10"/>
<text class="h" x="572" y="156">lightgbm-predictor</text>
<text class="m" x="572" y="176">/v2/models/.../infer -&gt; 4.1576</text>

<text class="s" x="560" y="210">ensemble-node: same input to both, in parallel</text>

<rect class="rt" x="380" y="222" width="140" height="64" rx="10"/>
<text class="h" x="392" y="246">collected</text>
<text class="m" x="392" y="266">{"0": .., "1": ..}</text>

<rect class="cb" x="560" y="300" width="290" height="64" rx="10"/>
<text class="h" x="572" y="324">ensemble-combiner</text>
<text class="m" x="572" y="344">data: $response -&gt; 3.4471</text>

<path class="arrow" d="M166 110 H188"/>
<path class="arrow" d="M340 110 H378"/>
<path class="arrow" d="M520 100 C 540 90, 545 74, 558 72"/>
<path class="arrow" d="M520 120 C 540 130, 545 156, 558 160"/>
<path class="arrow" d="M560 82 C 530 140, 500 190, 470 220"/>
<path class="arrow" d="M560 168 C 540 200, 520 210, 500 220"/>
<path class="arrow" d="M450 286 C 470 320, 520 332, 558 332"/>

<g><circle class="badge" cx="178" cy="92" r="10"/><text class="n" x="174" y="97">1</text></g>
<g><circle class="badge" cx="540" cy="58" r="10"/><text class="n" x="536" y="63">2</text></g>
<g><circle class="badge" cx="526" cy="226" r="10"/><text class="n" x="522" y="231">3</text></g>
<g><circle class="badge" cx="540" cy="318" r="10"/><text class="n" x="536" y="323">4</text></g>

<circle class="dot d1" r="7" cx="0" cy="0" opacity="0"/>
<circle class="dot d2" r="7" cx="0" cy="0" opacity="0"/>
<circle class="dot d3" r="7" cx="0" cy="0" transform="translate(826 332)"/>

<text class="s" x="380" y="392">1 in through ingress-nginx - 2 both models at once - 3 their answers</text>
<text class="s" x="380" y="410">keyed "0" and "1" - 4 that whole response goes to the combiner,</text>
<text class="s" x="380" y="428">which returns one value: (2.7366 + 4.1576) / 2</text>
</svg>
