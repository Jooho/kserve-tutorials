apiVersion: v1
kind: Pod
metadata:
  name: model-upload-helper
  namespace: kserve-graph-demo
spec:
  containers:
  - name: uploader
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: model-storage
      mountPath: /mnt/models
  volumes:
  - name: model-storage
    persistentVolumeClaim:
      claimName: model-pvc
  restartPolicy: Never
