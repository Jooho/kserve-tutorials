<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
<title id="t">How the EPP picks a Pod in this run</title>
<desc id="d">The EPP parses the request, then the scheduling profile default scores every ready Pod with queue-scorer at weight 2 and prefix-cache-scorer at weight 3, and max-score-picker takes the highest weighted sum. The metrics-data-source plugin keeps per-Pod numbers such as the queue size. The EPP exports what it sees on port 9090: pool averages and the prefix indexer histograms.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
  .h { font-size: 15px; font-weight: 650; }
  .s { font-size: 12.5px; fill: #4a5263; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #2b3140; }
  .ep { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.5; }
  .sc { fill: #f3f0ff; stroke: #7048e8; stroke-width: 1.5; }
  .wl { fill: #ebfbee; stroke: #2f9e44; stroke-width: 1.5; }
  .cl { fill: #f8f9fa; stroke: #868e96; stroke-width: 1.5; }
  .side { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .frame { fill: none; stroke: #1c7ed6; stroke-width: 1.3; stroke-dasharray: 6 4; }
  .arrow { stroke: #6b7385; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .dash { stroke: #adb5bd; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#b); }
  .ah { fill: #6b7385; } .bh { fill: #adb5bd; }
  .flow { stroke: #e03131; stroke-width: 2.4; fill: none; stroke-dasharray: 10 400; animation: flow 5s linear infinite; }
  @keyframes flow { from { stroke-dashoffset: 410 } to { stroke-dashoffset: 0 } }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e9ef; } .s { fill: #b4bccb; } .m { fill: #d5dae3; }
    .ep { fill: #132a3d; stroke: #4dabf7; } .sc { fill: #241f3d; stroke: #9775fa; }
    .wl { fill: #16301d; stroke: #51cf66; } .cl, .side { fill: #1b2029; } .frame { stroke: #4dabf7; }
    .arrow { stroke: #8b93a5; } .ah { fill: #8b93a5; } .flow { stroke: #ff6b6b; }
  }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dasharray: none; opacity: 0.5; } }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="bh" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="frame" x="150" y="16" width="576" height="248" rx="14"/>
<text class="s" x="164" y="36">EPP, main container (effective config from its log)</text>

<rect class="cl" x="16" y="104" width="116" height="64" rx="10"/>
<text class="h" x="28" y="128">Envoy</text>
<text class="s" x="28" y="148">ExtProc: which Pod?</text>

<rect class="ep" x="168" y="96" width="140" height="80" rx="10"/>
<text class="h" x="180" y="120">parsers</text>
<text class="m" x="180" y="140">openai-parser</text>
<text class="m" x="180" y="154">anthropic-parser</text>
<text class="m" x="180" y="168">vllmhttp-parser</text>

<rect class="sc" x="332" y="52" width="196" height="64" rx="10"/>
<text class="h" x="344" y="76">queue-scorer  x2</text>
<text class="s" x="344" y="98">shorter queue, higher score</text>

<rect class="sc" x="332" y="152" width="196" height="64" rx="10"/>
<text class="h" x="344" y="176">prefix-cache-scorer  x3</text>
<text class="s" x="344" y="198">prompt start seen before</text>

<rect class="ep" x="556" y="104" width="154" height="64" rx="10"/>
<text class="h" x="568" y="128">max-score-picker</text>
<text class="s" x="568" y="148">highest weighted sum</text>

<rect class="wl" x="752" y="104" width="112" height="64" rx="10"/>
<text class="h" x="764" y="128">one Pod</text>
<text class="m" x="764" y="148">ip:8000</text>

<path class="arrow" d="M132 136 H166"/>
<path class="arrow" d="M308 128 C 320 110, 318 90, 330 86"/>
<path class="arrow" d="M308 146 C 320 166, 318 180, 330 184"/>
<path class="arrow" d="M528 86 C 540 90, 542 120, 554 128"/>
<path class="arrow" d="M528 184 C 540 180, 542 152, 554 146"/>
<path class="arrow" d="M710 136 H750"/>
<path class="flow" d="M132 136 H168 M308 128 C 320 110, 318 90, 330 86 M528 86 C 540 90, 542 120, 554 128 M710 136 H752"/>

<text class="s" x="168" y="236">profile "default" (single-profile-handler);</text>
<text class="s" x="168" y="252">no kv-cache-utilization-scorer in this config</text>

<rect class="side" x="16" y="290" width="404" height="124" rx="10"/>
<text class="h" x="30" y="314">What the EPP knows about Pods</text>
<text class="m" x="30" y="336">metrics-data-source</text>
<text class="m" x="30" y="352">  + core-metrics-extractor</text>
<text class="s" x="30" y="376">per-Pod numbers, e.g. queue size of</text>
<text class="m" x="30" y="394">demo-model-kserve-...-rank-0</text>

<rect class="side" x="440" y="290" width="424" height="124" rx="10"/>
<text class="h" x="454" y="314">What it exports on :9090 (bearer token)</text>
<text class="m" x="454" y="336">inference_pool_ready_pods</text>
<text class="m" x="454" y="352">inference_pool_average_queue_size</text>
<text class="m" x="454" y="368">inference_pool_average_kv_cache_utilization</text>
<text class="m" x="454" y="384">inference_pool_average_running_requests</text>
<text class="m" x="454" y="400">inference_extension_prefix_indexer_*</text>
<path class="dash" d="M640 264 V288"/>
</svg>
