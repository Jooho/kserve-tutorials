<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
<title id="t">The journey of one completion request</title>
<desc id="d">curl sends the request to the worker node IP and NodePort 31084. The Envoy proxy Pod receives it on port 10080 and gives it an x-request-id. The HTTPRoute rule matches and rewrites the path; its backend is the InferencePool. Envoy asks the EPP over ExtProc gRPC which Pod to use, then forwards the request to the vLLM Pod. The answer goes back through Envoy, and its id contains the x-request-id.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
  .h { font-size: 15px; font-weight: 650; }
  .s { font-size: 12.5px; fill: #4a5263; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #2b3140; }
  .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .gw { fill: #eef2ff; stroke: #3b5bdb; stroke-width: 1.5; }
  .rt { fill: #f3f0ff; stroke: #7048e8; stroke-width: 1.5; }
  .ep { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.5; }
  .wl { fill: #ebfbee; stroke: #2f9e44; stroke-width: 1.5; }
  .cl { fill: #f8f9fa; stroke: #868e96; stroke-width: 1.5; }
  .arrow { stroke: #6b7385; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .back { stroke: #2f9e44; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#g); }
  .ah { fill: #6b7385; } .gh { fill: #2f9e44; }
  .badge { fill: #e03131; }
  .dot { fill: #e03131; animation: travel 8s infinite; }
  .tag { fill: #fff4e6; stroke: #e8590c; stroke-width: 1.2; }
  .tagt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #a33a00; }
  @keyframes travel {
    0%   { transform: translate(86px, 100px); opacity: 0 }
    4%   { opacity: 1 }
    16%  { transform: translate(296px, 100px) }
    30%  { transform: translate(516px, 100px) }
    44%  { transform: translate(755px, 100px) }
    58%  { transform: translate(755px, 300px) }
    66%  { transform: translate(755px, 300px) }
    82%  { transform: translate(516px, 300px) }
    92%  { transform: translate(516px, 300px); opacity: 1 }
    100% { transform: translate(516px, 300px); opacity: 0 }
  }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e9ef; } .s { fill: #b4bccb; } .m { fill: #d5dae3; } .n { fill: #ffffff; }
    .gw { fill: #1e2540; stroke: #748ffc; } .rt { fill: #241f3d; stroke: #9775fa; }
    .ep { fill: #132a3d; stroke: #4dabf7; } .wl { fill: #16301d; stroke: #51cf66; }
    .cl { fill: #1b2029; } .arrow { stroke: #8b93a5; } .ah { fill: #8b93a5; }
    .back { stroke: #51cf66; } .gh { fill: #51cf66; }
    .tag { fill: #3a2414; stroke: #ff922b; } .tagt { fill: #ffc078; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; transform: translate(516px, 300px); } }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="gh" d="M0 0L10 5L0 10z"/></marker>
</defs>

<!-- top row -->
<rect class="cl" x="16" y="46" width="148" height="108" rx="10"/>
<text class="h" x="28" y="70">Client (curl)</text>
<text class="m" x="28" y="92">POST</text>
<text class="m" x="28" y="108">node IP:31084</text>
<text class="m" x="28" y="124">/&lt;ns&gt;/demo-model</text>
<text class="m" x="28" y="140">/v1/completions</text>

<rect class="gw" x="186" y="46" width="208" height="108" rx="10"/>
<text class="h" x="198" y="70">Envoy proxy Pod</text>
<text class="m" x="198" y="90">envoy-gateway-system</text>
<text class="m" x="198" y="106">:10080 &lt;- svc 80 &lt;- 31084</text>
<text class="s" x="198" y="128">gives the request an</text>
<text class="s" x="198" y="144">x-request-id; access log</text>

<rect class="rt" x="416" y="46" width="208" height="108" rx="10"/>
<text class="h" x="428" y="70">HTTPRoute, rule 0</text>
<text class="m" x="428" y="90">match .../v1/completions</text>
<text class="m" x="428" y="106">rewrite -&gt; /v1/completions</text>
<text class="s" x="428" y="134">backend: InferencePool</text>

<rect class="rt" x="646" y="46" width="218" height="108" rx="10"/>
<text class="h" x="658" y="70">InferencePool</text>
<text class="m" x="658" y="90">selector: workload Pods</text>
<text class="m" x="658" y="106">endpointPicker: EPP :9002</text>
<text class="s" x="658" y="128">accepted by Envoy AI</text>
<text class="s" x="658" y="144">Gateway's controller</text>

<path class="arrow" d="M164 100 H184"/>
<path class="arrow" d="M394 100 H414"/>
<path class="arrow" d="M624 100 H644"/>
<path class="arrow" d="M755 154 V244"/>

<!-- bottom row -->
<rect class="ep" x="646" y="246" width="218" height="108" rx="10"/>
<text class="h" x="658" y="270">EPP scheduler</text>
<text class="m" x="658" y="290">ExtProc gRPC :9002</text>
<text class="s" x="658" y="312">scores the Pods, returns one</text>
<text class="s" x="658" y="328">logs the x-request-id</text>
<text class="s" x="658" y="344">(3 sets of lines in this run)</text>

<rect class="wl" x="416" y="246" width="208" height="108" rx="10"/>
<text class="h" x="428" y="270">vLLM Pod</text>
<text class="m" x="428" y="290">e.g. 10.244.1.16:8000</text>
<text class="s" x="428" y="312">answer "id":</text>
<text class="m" x="428" y="330">cmpl-&lt;x-request-id&gt;</text>

<path class="arrow" d="M646 300 H626"/>
<path class="back" d="M416 300 C 300 300, 220 260, 200 160"/>
<text class="s" x="250" y="322">answer back via Envoy</text>

<!-- numbered steps -->
<g><circle class="badge" cx="175" cy="78" r="10"/><text class="n" x="171" y="83">1</text></g>
<g><circle class="badge" cx="405" cy="78" r="10"/><text class="n" x="401" y="83">2</text></g>
<g><circle class="badge" cx="635" cy="78" r="10"/><text class="n" x="631" y="83">3</text></g>
<g><circle class="badge" cx="780" cy="200" r="10"/><text class="n" x="776" y="205">4</text></g>
<g><circle class="badge" cx="635" cy="322" r="10"/><text class="n" x="631" y="327">5</text></g>

<circle class="dot" r="7" cx="0" cy="0" transform="translate(516 300)"/>

<rect class="tag" x="16" y="372" width="250" height="24" rx="12"/>
<text class="tagt" x="28" y="388">x-request-id: e.g. fb75d8dc-...</text>
<text class="s" x="280" y="388">one id ties the answer, the Envoy log and the EPP log together</text>

<text class="s" x="16" y="420">1 Envoy receives it - 2 the route matches and strips the prefix - 3 its backend is the InferencePool</text>
<text class="s" x="16" y="440">4 Envoy asks the EPP which Pod (ExtProc) - 5 Envoy forwards to that Pod; upstream_host in its log</text>
<text class="s" x="16" y="460">names the Pod (e.g. 10.244.1.16:8000)</text>
</svg>
