<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">How the EPP picks a Pod (default configuration)</title>
<desc id="d">Envoy asks the EPP which Pod. Four scorers give every Pod a score. queue-scorer, weight 2, scores Pods with fewer waiting requests higher, and kv-cache-utilization-scorer, weight 2, scores Pods with a less full KV cache higher; both use the EPP's copy of each Pod's vLLM numbers. prefix-cache-scorer, weight 3, scores Pods higher that already got more of this prompt, using the EPP's own prefix index, built by approx-prefix-cache-producer and token-producer. no-hit-lru-scorer, weight 2, acts when no Pod has the prompt: it prefers the Pod that got such a new prompt least recently. max-score-picker takes the Pod with the highest weighted sum, and the EPP returns its address to Envoy.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
  .h { font-size: 15px; font-weight: 650; }
  .s { font-size: 12.5px; fill: #4a5263; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #2b3140; }
  .w { font-size: 12.5px; font-weight: 650; fill: #c92a2a; }
  .cl { fill: #f8f9fa; stroke: #868e96; stroke-width: 1.5; }
  .epp { fill: none; stroke: #1c7ed6; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .in { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.2; }
  .sc { fill: #f3f0ff; stroke: #7048e8; stroke-width: 1.5; }
  .pk { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.5; }
  .pod { fill: #ebfbee; stroke: #2f9e44; stroke-width: 1.5; }
  .arrow { stroke: #6b7385; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .ah { fill: #6b7385; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e9ef; } .s { fill: #b4bccb; } .m { fill: #d5dae3; } .w { fill: #ff8787; }
    .cl, .in { fill: #1b2029; } .epp { stroke: #4dabf7; }
    .sc { fill: #241f3d; stroke: #9775fa; } .pk { fill: #132a3d; stroke: #4dabf7; }
    .pod { fill: #16301d; stroke: #51cf66; } .arrow { stroke: #8b93a5; } .ah { fill: #8b93a5; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

<rect class="cl" x="16" y="235" width="120" height="70" rx="10"/>
<text class="h" x="30" y="261">Envoy</text>
<text class="s" x="30" y="283">"which Pod?"</text>

<rect class="epp" x="160" y="20" width="734" height="490" rx="12"/>
<text class="s" x="176" y="42">EPP scheduler (one call per ExtProc filter: one per match of the InferencePool route rules)</text>

<rect class="in" x="176" y="70" width="230" height="130" rx="8"/>
<text class="h" x="190" y="94">EPP's copy of vLLM numbers</text>
<text class="s" x="190" y="114">read from each Pod's /metrics</text>
<text class="m" x="190" y="140">vllm:num_requests_waiting</text>
<text class="m" x="190" y="162">vllm:kv_cache_usage_perc</text>

<rect class="in" x="176" y="290" width="230" height="170" rx="8"/>
<text class="h" x="190" y="314">EPP's own prefix index</text>
<text class="s" x="190" y="334">which Pod got which prompt</text>
<text class="m" x="190" y="358">token-producer</text>
<text class="s" x="190" y="376">estimates the prompt's tokens</text>
<text class="m" x="190" y="398">approx-prefix-cache-producer</text>
<text class="s" x="190" y="416">hashes them into blocks</text>
<text class="s" x="190" y="440">not vLLM's prefix cache</text>

<rect class="sc" x="440" y="60" width="280" height="72" rx="10"/>
<text class="h" x="454" y="84">queue-scorer</text>
<text class="w" x="644" y="84">weight 2</text>
<text class="s" x="454" y="106">fewer waiting requests,</text>
<text class="s" x="454" y="122">higher score (A)</text>

<rect class="sc" x="440" y="150" width="280" height="72" rx="10"/>
<text class="h" x="454" y="174">kv-cache-utilization-scorer</text>
<text class="w" x="644" y="196">weight 2</text>
<text class="s" x="454" y="196">less full KV cache,</text>
<text class="s" x="454" y="212">higher score (B)</text>

<rect class="sc" x="440" y="280" width="280" height="72" rx="10"/>
<text class="h" x="454" y="304">prefix-cache-scorer</text>
<text class="w" x="644" y="304">weight 3</text>
<text class="s" x="454" y="326">more of this prompt already sent</text>
<text class="s" x="454" y="342">to the Pod, higher score (C)</text>

<rect class="sc" x="440" y="370" width="280" height="88" rx="10"/>
<text class="h" x="454" y="394">no-hit-lru-scorer</text>
<text class="w" x="644" y="394">weight 2</text>
<text class="s" x="454" y="416">only when no Pod has the prompt:</text>
<text class="s" x="454" y="432">the Pod that got a new prompt least</text>
<text class="s" x="454" y="448">recently, higher score (D)</text>

<rect class="pk" x="752" y="190" width="132" height="140" rx="10"/>
<text class="h" x="766" y="216">max-score-</text>
<text class="h" x="766" y="234">picker</text>
<text class="s" x="766" y="258">highest</text>
<text class="m" x="766" y="278">2xA + 2xB</text>
<text class="m" x="766" y="296">+ 3xC + 2xD</text>

<rect class="pod" x="752" y="380" width="132" height="70" rx="10"/>
<text class="h" x="766" y="406">answer</text>
<text class="s" x="766" y="428">one Pod's IP:port</text>

<path class="arrow" d="M136 270 H174"/>
<path class="arrow" d="M406 110 H438"/>
<path class="arrow" d="M406 170 H438"/>
<path class="arrow" d="M406 330 H438"/>
<path class="arrow" d="M406 410 H438"/>
<path class="arrow" d="M720 96 C 740 96, 745 190, 760 190"/>
<path class="arrow" d="M720 186 C 735 186, 738 230, 750 236"/>
<path class="arrow" d="M720 316 C 735 316, 738 290, 750 284"/>
<path class="arrow" d="M720 414 C 740 414, 745 330, 760 330"/>
<path class="arrow" d="M818 330 V378"/>

<text class="s" x="16" y="540">Every ready Pod gets all four scores; the answer goes back to Envoy, which sends the request to that Pod. With one Pod, as here, it is always that Pod.</text>
</svg>
