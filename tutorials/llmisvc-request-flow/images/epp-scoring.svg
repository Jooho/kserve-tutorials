<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">How the EPP picks a Pod (default configuration)</title>
<desc id="d">Envoy asks the EPP which Pod. queue-scorer, weight 2, scores Pods with fewer waiting requests higher, using the EPP's copy of each Pod's vLLM numbers. prefix-cache-scorer, weight 3, scores Pods higher that already got more of this prompt, using the EPP's own prefix index, built by approx-prefix-cache-producer and token-producer. max-score-picker takes the Pod with the highest sum of 2 times the queue score and 3 times the prefix score, and the EPP returns its address to Envoy.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
  .h { font-size: 15px; font-weight: 650; }
  .s { font-size: 12.5px; fill: #4a5263; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #2b3140; }
  .w { font-size: 12.5px; font-weight: 650; fill: #c92a2a; }
  .cl { fill: #f8f9fa; stroke: #868e96; stroke-width: 1.5; }
  .epp { fill: none; stroke: #1c7ed6; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .in { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.2; }
  .sc { fill: #f3f0ff; stroke: #7048e8; stroke-width: 1.5; }
  .pk { fill: #e7f5ff; stroke: #1c7ed6; stroke-width: 1.5; }
  .pod { fill: #ebfbee; stroke: #2f9e44; stroke-width: 1.5; }
  .arrow { stroke: #6b7385; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .ah { fill: #6b7385; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e9ef; } .s { fill: #b4bccb; } .m { fill: #d5dae3; } .w { fill: #ff8787; }
    .cl, .in { fill: #1b2029; } .epp { stroke: #4dabf7; }
    .sc { fill: #241f3d; stroke: #9775fa; } .pk { fill: #132a3d; stroke: #4dabf7; }
    .pod { fill: #16301d; stroke: #51cf66; } .arrow { stroke: #8b93a5; } .ah { fill: #8b93a5; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

<rect class="cl" x="16" y="190" width="120" height="70" rx="10"/>
<text class="h" x="30" y="216">Envoy</text>
<text class="s" x="30" y="238">"which Pod?"</text>

<rect class="epp" x="160" y="20" width="734" height="400" rx="12"/>
<text class="s" x="176" y="42">EPP scheduler (one call per InferencePool route rule)</text>

<rect class="in" x="176" y="60" width="230" height="110" rx="8"/>
<text class="h" x="190" y="84">EPP's copy of vLLM numbers</text>
<text class="s" x="190" y="104">read from each Pod's /metrics</text>
<text class="m" x="190" y="126">vllm:num_requests_waiting</text>
<text class="m" x="190" y="144">vllm:kv_cache_usage_perc</text>
<text class="s" x="190" y="162">(KV usage: read, not scored)</text>

<rect class="in" x="176" y="250" width="230" height="150" rx="8"/>
<text class="h" x="190" y="274">EPP's own prefix index</text>
<text class="s" x="190" y="294">which Pod got which prompt</text>
<text class="m" x="190" y="318">token-producer</text>
<text class="s" x="190" y="336">estimates the prompt's tokens</text>
<text class="m" x="190" y="358">approx-prefix-cache-producer</text>
<text class="s" x="190" y="376">hashes them into blocks</text>
<text class="s" x="190" y="392">not vLLM's prefix cache</text>

<rect class="sc" x="440" y="70" width="270" height="90" rx="10"/>
<text class="h" x="454" y="96">queue-scorer</text>
<text class="w" x="634" y="96">weight 2</text>
<text class="s" x="454" y="120">fewer waiting requests,</text>
<text class="s" x="454" y="138">higher score (A)</text>

<rect class="sc" x="440" y="260" width="270" height="90" rx="10"/>
<text class="h" x="454" y="286">prefix-cache-scorer</text>
<text class="w" x="634" y="286">weight 3</text>
<text class="s" x="454" y="310">more of this prompt already sent</text>
<text class="s" x="454" y="328">to the Pod, higher score (B)</text>

<rect class="pk" x="752" y="160" width="128" height="130" rx="10"/>
<text class="h" x="772" y="186">max-score-</text>
<text class="h" x="772" y="204">picker</text>
<text class="s" x="772" y="228">highest</text>
<text class="m" x="772" y="248">2xA + 3xB</text>

<rect class="pod" x="752" y="330" width="128" height="70" rx="10"/>
<text class="h" x="772" y="356">answer</text>
<text class="s" x="772" y="378">one Pod's IP:port</text>

<path class="arrow" d="M136 225 H174"/>
<path class="arrow" d="M406 115 H438"/>
<path class="arrow" d="M406 305 H438"/>
<path class="arrow" d="M710 115 C 735 115, 735 180, 750 190"/>
<path class="arrow" d="M710 305 C 735 305, 735 270, 750 262"/>
<path class="arrow" d="M822 290 V328"/>

<text class="s" x="16" y="450">Every ready Pod gets both scores; the answer goes back to Envoy, which sends the request to that Pod. With one Pod, as here, it is always that Pod.</text>
</svg>
