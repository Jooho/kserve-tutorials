# The docs tree is generated: run `./tut site` first (CI does).
site_name: KServe Tutorials
repo_url: https://github.com/Jooho/kserve-tutorials
edit_uri: ""
docs_dir: build/site-src
site_dir: build/site
theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - {locale: en, name: English, default: true, build: true}
        - {locale: ko, name: 한국어, build: true}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
validation:
  links: {not_found: warn, unrecognized_links: info, absolute_links: info}
